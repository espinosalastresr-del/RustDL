[package]
name = "rustdl"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Resilient CLI download manager for unstable connections and iSH/iOS"
rust-version = "1.70"

[lib]
name = "rustdl"
path = "src/lib.rs"

[[bin]]
name = "rustdl"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.36.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
reqwest = { version = "=0.11.20", default-features = false, features = ["rustls-tls", "stream"] }
clap = { version = "=4.4.18", features = ["derive", "env", "string"] }
clap_complete = "=4.4.9"
indicatif = "=0.17.8"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
toml = "=0.8.2"
sha2 = "=0.10.8"
md-5 = "=0.10.6"
sha1 = "=0.10.6"
hex = "=0.4.3"
thiserror = "=1.0.57"
anyhow = "=1.0.80"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter", "json"] }
url = "=2.4.1"
dirs = "=5.0.1"
rand = "=0.8.5"
fs2 = "=0.4.3"
chrono = { version = "=0.4.34", default-features = false, features = ["serde", "clock", "std"] }
bytes = "=1.5.0"
futures-util = "0.3"
tokio-stream = "=0.1.14"
humantime = "=2.1.0"
regex = "=1.10.3"
once_cell = "=1.19.0"
parking_lot = "=0.12.1"
uuid = { version = "=1.7.0", features = ["v4", "serde"] }
h2 = "=0.3.22"
indexmap = "=2.2.6"
hashbrown = "=0.14.3"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
getrandom = "=0.2.15"
