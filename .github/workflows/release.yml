name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # iSH / Alpine x86 (32-bit)
          - name: ish
            os: ubuntu-latest
            target: i686-unknown-linux-musl
            binary: rustdl

          # Alpine Linux x86_64
          - name: alpine-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: rustdl

          # Windows 64-bit
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rustdl.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ------------------------------------------------------------
      # Linux musl targets
      # ------------------------------------------------------------

      - name: Setup cross toolchain
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          OUT="rustdl-${{ matrix.name }}"

          test -f "$BIN"

          cp "$BIN" "$OUT"

          # Remove symbols to reduce size.
          strip "$OUT" || true

          chmod +x "$OUT"

          sha256sum "$OUT" > "${OUT}.sha256"

          echo "ASSET=$OUT" >> "$GITHUB_ENV"
          echo "CHECKSUM=${OUT}.sha256" >> "$GITHUB_ENV"

          echo "Created:"
          ls -lh "$OUT" "${OUT}.sha256"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $out = "rustdl-${{ matrix.name }}.exe"

          if (!(Test-Path $bin)) {
            throw "Binary not found: $bin"
          }

          Copy-Item $bin $out

          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()

          "$hash  $out" | Out-File "${out}.sha256" -Encoding ascii

          "ASSET=$out" >> $env:GITHUB_ENV
          "CHECKSUM=${out}.sha256" >> $env:GITHUB_ENV

          Write-Host "Created:"
          Get-Item $out
          Get-Item "${out}.sha256"

      # ------------------------------------------------------------
      # Upload individual artifacts
      # ------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdl-${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}

  # ================================================================
  # Release
  # ================================================================

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          find artifacts -type f -exec cp {} release/ \;

          cd release

          echo "Release files:"
          ls -lh

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          cd release

          rm -f SHA256SUMS

          sha256sum \
            rustdl-ish \
            rustdl-alpine-x86_64 \
            rustdl-windows-x86_64.exe \
            > SHA256SUMS

          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/rustdl-ish
            release/rustdl-ish.sha256
            release/rustdl-alpine-x86_64
            release/rustdl-alpine-x86_64.sha256
            release/rustdl-windows-x86_64.exe
            release/rustdl-windows-x86_64.exe.sha256
            release/SHA256SUMS
          generate_release_notes: true
